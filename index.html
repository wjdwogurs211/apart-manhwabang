<style>
/* 레이아웃: 웹툰 플랫폼 모바일 구조(상단 바 + 홈 / 작품홈 / 세로 스크롤 뷰어), 가운데 최대 720px 기둥 */
:root {

  --sub: #f4f5f8;          /* 구역 바탕, 남색 쪽으로 살짝 기운 회색 */

  --col: 720px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {

    --chip: #232735; --read: #5d6272; --navy: #9fb0ff; --navy-ink: #12141a; --viewer-bg: #12141a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {

  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.55; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: var(--col); margin: 0 auto; padding-inline: 16px; }

/* 상단 바 */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); }
.top__in { display: flex; align-items: center; gap: 12px; height: 56px; }
.brand { display: flex; align-items: center; gap: 8px; font-family: var(--font-display); font-size: 21px; letter-spacing: -.01em; }
.brand img { width: 30px; height: 30px; border-radius: 8px; }
.brand b { background: var(--accent); color: var(--accent-ink); padding: 0 6px; border-radius: 4px; font-weight: 400; }
.top nav { margin-left: auto; display: flex; gap: 4px; }
.top nav a { padding: 6px 10px; border-radius: 999px; font-weight: 700; font-size: 14px; color: var(--muted); }
.top nav a[aria-current="page"] { color: var(--fg); background: var(--sub); }

/* 홈 */
.hero { display: block; position: relative; margin-top: 16px; border-radius: 14px; overflow: hidden; background: var(--sub); aspect-ratio: 16 / 9; max-width: 100%; }
.hero img { width: 100%; height: 100%; object-fit: cover; display: block; }
.hero__txt { position: absolute; inset: auto 0 0 0; padding: 48px 18px 18px; color: #fff;

.hero__badge { display: inline-block; background: var(--accent); color: var(--accent-ink); font-size: 12px; font-weight: 900; padding: 2px 8px; border-radius: 4px; }
.hero__title { font-family: var(--font-display); font-size: clamp(26px, 6vw, 38px); line-height: 1.15; margin: 8px 0 4px; text-wrap: balance; }
.hero__sub { margin: 0; font-size: 14px; opacity: .9; }
.sec { margin-top: 28px; }
.sec__head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.sec__title { font-size: 18px; font-weight: 900; margin: 0; letter-spacing: -.02em; }
.sec__more { font-size: 13px; color: var(--muted); font-weight: 500; }
.resume { display: flex; gap: 12px; align-items: center; padding: 12px; border-radius: 12px; background: var(--sub); }

.strip small { color: var(--muted); font-size: 12px; }

<script>
(() => {
  const S = window.SERIES;
  const app = document.getElementById("app");
  const eps = S.episodes;
  const last = eps[eps.length - 1];
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const dot = (d) => d.slice(2).replaceAll("-", ".");

  // 로그인 없이 이 브라우저에만 저장: 읽은 화, 마지막 위치, 관심, 정렬
  const store = {
    get(k, d) { try { const v = localStorage.getItem("mhb:" + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem("mhb:" + k, JSON.stringify(v)); } catch {} },
  };

  const top = (cur) => `
    <header class="top"><div class="wrap top__in">
      <a class="brand" href="#home"><img src="img/logo.jpg" alt="" width="30" height="30">아파트 <b>만화방</b></a>
      <nav aria-label="메뉴">
        <a href="#home" ${cur === "home" ? 'aria-current="page"' : ""}>홈</a>
        <a href="#series" ${cur === "series" ? 'aria-current="page"' : ""}>작품</a>
      </nav>
    </div></header>`;

  const foot = () => `<footer class="foot wrap">로그인 없이 누구나 볼 수 있어요. 읽은 기록은 이 브라우저에만 남아요.<br>
    작가 인스타그램 <a href="${esc(S.instagram)}" target="_blank" rel="noopener">@${esc(S.instagram.split("/").filter(Boolean).pop())}</a></footer>`;

  function resumeCard() {
    const r = store.get("last", null);
    const e = r && eps.find((x) => x.no === r.no);
    if (!e) return "";
    return `<section class="sec" aria-labelledby="h-resume"><div class="sec__head"><h2 class="sec__title" id="h-resume">이어보기</h2></div>
      <a class="resume" href="#ep${e.no}"><img src="${e.thumb}" alt="" width="96" height="58">
      <div><small>${esc(S.title)}</small><strong>${e.no}화 「${esc(e.title)}」</strong></div><span class="go">계속 보기</span></a></section>`;
  }

  function home() {
    return top("home") + `<main class="wrap">
      <a class="hero" href="#series" aria-label="${esc(S.title)} 작품홈으로">
        <img src="img/banner.jpg" alt="관리사무소 직원 다섯 명이 아파트 앞에 서 있는 그림" onerror="this.src='img/ep10/thumb.jpg'">
        <div class="hero__txt"><span class="hero__badge">시즌 1 완결 · 10화</span>
          <h1 class="hero__title">${esc(S.title)}</h1><p class="hero__sub">${esc(S.tagline)}</p></div>
      </a>
      ${resumeCard()}
      <section class="sec" aria-labelledby="h-works"><div class="sec__head"><h2 class="sec__title" id="h-works">연재 작품</h2><a class="sec__more" href="#series">전체보기</a></div>
        <div class="works"><a class="work" href="#series"><img src="img/poster.jpg" alt="" width="480" height="623">
          <strong><span class="flag">완결</span>${esc(S.title)}</strong><small>${esc(S.author)}</small></a></div>
      </section>
      <section class="sec" aria-labelledby="h-eps"><div class="sec__head"><h2 class="sec__title" id="h-eps">회차 바로 보기</h2><a class="sec__more" href="#series">목록</a></div>
        <div class="strip">${[...eps].reverse().map((e) => `<a href="#ep${e.no}"><img src="${e.thumb}" alt="" width="168" height="101" loading="lazy">
          <strong>${e.no}화 「${esc(e.title)}」</strong><small>${esc(e.kind)}</small></a>`).join("")}</div>
      </section>
    </main>` + foot();
  }

  function series() {
    const read = store.get("read", []);
    const r = store.get("last", null);
    const asc = store.get("asc", false);
    const fav = store.get("fav", false);
    const list = asc ? eps : [...eps].reverse();
    const first = r ? eps.find((x) => x.no === r.no) : null;
    return top("series") + `<main class="wrap">
      <section class="info">
        <img src="img/poster.jpg" alt="${esc(S.title)} 포스터" width="480" height="623">
        <div><h1>${esc(S.title)}</h1><p class="by">글·그림 ${esc(S.author)} · <span class="flag">완결</span>시즌 1</p>
          <p>${esc(S.intro)}</p>
          <div class="tags">${S.tags.map((t) => `<span>#${esc(t)}</span>`).join("")}</div></div>
      </section>
      <div class="cta">
        <a class="btn btn--main" href="#ep${first ? first.no : 1}">${first ? `이어보기 ${first.no}화` : "첫화 보기"}</a>
        <button class="btn" id="fav" type="button" aria-pressed="${fav}">${fav ? "관심 웹툰 ✓" : "관심 웹툰 +"}</button>
      </div>
      <div class="listhead"><strong>총 ${eps.length}화</strong>
        <div class="sort" role="group" aria-label="정렬">
          <button type="button" id="s-desc" aria-pressed="${!asc}">최신순</button>
          <button type="button" id="s-asc" aria-pressed="${asc}">1화부터</button></div></div>
      <ol class="eps">${list.map((e) => `<li class="ep ${read.includes(e.no) ? "is-read" : ""}"><a href="#ep${e.no}">
        <img src="${e.thumb}" alt="" width="112" height="67" loading="lazy">
        <div><strong>${e.no}화 「${esc(e.title)}」</strong>
          <div class="meta"><span class="kind">${esc(e.kind)}</span><span>${dot(e.date)}</span>
            ${r && r.no === e.no ? '<span class="mark">이어보기</span>' : ""}${e === last ? '<span class="mark">최종화</span>' : ""}</div></div></a></li>`).join("")}</ol>
    </main>` + foot();
  }

  function viewer(no) {
    const i = eps.findIndex((x) => x.no === no);
    const e = eps[i], prev = eps[i - 1], next = eps[i + 1];
    return `<div class="viewer" id="v">
      <div class="vbar vbar--top"><div class="vbar__in">
        <a href="#series" aria-label="목록으로">← 목록</a><span class="t">${e.no}화 「${esc(e.title)}」</span>
        <a href="#home" aria-label="만화방 홈">홈</a></div><div class="prog" id="prog"></div></div>
      <div class="pages" id="pages">${e.pages.map(([src, w, h], k) =>
        `<img src="${src}" width="${w}" height="${h}" alt="${k === 0 ? `${e.no}화 ${esc(e.title)} 본문` : ""}" ${k > 1 ? 'loading="lazy"' : ""} decoding="async">`).join("")}</div>
      <div class="end">${next ? `<h2>다음 화</h2><a class="next" href="#ep${next.no}"><img src="${next.thumb}" alt="" width="140" height="84" loading="lazy">
          <div><small>${esc(next.kind)}</small><strong>${next.no}화 「${esc(next.title)}」</strong></div></a>`
        : `<div class="season-end"><strong>시즌 1 끝</strong><p>끝까지 봐 주셔서 고마워요. 시즌 2에서 다시 만나요.</p></div>`}</div>
      <div class="vbar vbar--bot"><div class="vbar__in">
        <a href="${prev ? "#ep" + prev.no : "#"}" ${prev ? "" : 'aria-disabled="true"'}>‹ 이전화</a>
        <a href="#series">목록</a>
        <a href="${next ? "#ep" + next.no : "#"}" ${next ? "" : 'aria-disabled="true"'}>다음화 ›</a></div></div>
    </div>`;
  }

  let off = [];
  function route() {
    off.forEach((f) => f()); off = [];
    const h = location.hash.slice(1) || "home";
    const m = /^ep(\d+)$/.exec(h);
    const no = m && +m[1];
    if (no && eps.some((x) => x.no === no)) {
      app.innerHTML = viewer(no);
      document.title = `${no}화 · ${S.title}`;
      window.scrollTo(0, 0);
      bindViewer(no);
    } else if (h === "series") {
      app.innerHTML = series(); document.title = `${S.title} · 아파트 만화방`; window.scrollTo(0, 0); bindSeries();
    } else {
      app.innerHTML = home(); document.title = "아파트 만화방"; window.scrollTo(0, 0);
    }
  }

  function bindSeries() {
    const rerender = () => { const y = scrollY; app.innerHTML = series(); bindSeries(); scrollTo(0, y); };
    document.getElementById("fav").onclick = () => { store.set("fav", !store.get("fav", false)); rerender(); };
    document.getElementById("s-desc").onclick = () => { store.set("asc", false); rerender(); };
    document.getElementById("s-asc").onclick = () => { store.set("asc", true); rerender(); };
  }

  function bindViewer(no) {
    const v = document.getElementById("v"), prog = document.getElementById("prog");
    const read = store.get("read", []);
    if (!read.includes(no)) store.set("read", [...read, no]);
    const saved = store.get("last", null);
    if (saved && saved.no === no && saved.y > 400) setTimeout(() => scrollTo(0, saved.y), 60);
    let lastY = scrollY, t = 0;
    const onScroll = () => {
      const max = document.documentElement.scrollHeight - innerHeight;
      prog.style.width = (max > 0 ? (scrollY / max) * 100 : 0) + "%";
      // 아래로 읽어 내려가면 바를 숨기고, 위로 올리거나 끝에 닿으면 보인다
      if (scrollY > lastY + 8 && scrollY > 80) v.classList.add("is-hidden");
      else if (scrollY < lastY - 8 || scrollY >= max - 4) v.classList.remove("is-hidden");
      lastY = scrollY;
      clearTimeout(t); t = setTimeout(() => store.set("last", { no, y: Math.round(scrollY) }), 200);
    };
    const onTap = (ev) => { if (ev.target.closest("#pages")) v.classList.toggle("is-hidden"); };
    const onKey = (ev) => {
      const i = eps.findIndex((x) => x.no === no);
      if (ev.key === "ArrowRight" && eps[i + 1]) location.hash = "ep" + eps[i + 1].no;
      if (ev.key === "ArrowLeft" && eps[i - 1]) location.hash = "ep" + eps[i - 1].no;
    };
    addEventListener("scroll", onScroll, { passive: true });
    v.addEventListener("click", onTap);
    addEventListener("keydown", onKey);
    off.push(() => { removeEventListener("scroll", onScroll); removeEventListener("keydown", onKey); });
    store.set("last", { no, y: (saved && saved.no === no) ? saved.y : 0 });
  }

  addEventListener("hashchange", route);
  route();
})();
</script>
